name: node watchdog

# Every half hour, starts a chained node if none is running, so a broken chain heals on its own.
# Scheduled runs are skipped in a private repository, where every run would cost a billed minute.
# GitHub turns off schedules in a public repository after 60 days without a commit, so commit something at least every two months.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: How long the node it starts runs (testing only)
        default: "350"
      chain:
        description: Whether that node starts the next one (testing only)
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - name: Start a node if none is running
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MINUTES: ${{ inputs.minutes || '350' }}
          CHAIN: ${{ github.event_name == 'schedule' || inputs.chain }}
        run: |
          active=$(gh run list -w node.yml -L 20 --json status -q '[.[] | select(.status != "completed")] | length')
          if [ "$active" -gt 0 ]; then
            echo "$active node run(s) active, nothing to do."
            exit 0
          fi
          echo "No node is running, starting one."
          # GitHub's API fails now and then with a 5xx error, so try a few times.
          for attempt in 1 2 3; do
            gh workflow run node.yml -f minutes="$MINUTES" -f chain="$CHAIN" && exit 0
            sleep 20
          done
          exit 1
